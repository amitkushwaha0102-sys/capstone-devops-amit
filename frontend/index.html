<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Accelerator Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #38bdf8;
        }

        .file-drop {
            border: 2px dashed #334155;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 24px;
            transition: border 0.2s, background 0.2s;
        }

        .file-drop:hover {
            border-color: #38bdf8;
            background: #0f172a;
        }

        .file-drop p { font-size: 13px; color: #64748b; }
        .file-drop span { color: #38bdf8; font-weight: 500; }
        #file-name { margin-top: 8px; font-size: 12px; color: #38bdf8; }

        button {
            width: 100%;
            padding: 12px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #0284c7; }
        button:disabled { background: #334155; cursor: not-allowed; }

        #status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .success { background: #052e16; border: 1px solid #16a34a; color: #4ade80; }
        .error   { background: #2d0a0a; border: 1px solid #dc2626; color: #f87171; }
        .loading { background: #0c1a2e; border: 1px solid #0ea5e9; color: #38bdf8; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 DevOps Accelerator Platform</h1>
    <p class="subtitle">Upload your CSV file securely via AWS S3</p>

    <label>Your Name</label>
    <input type="text" id="userName" placeholder="e.g. Amit Kushwaha" />

    <label>Email Address</label>
    <input type="email" id="userEmail" placeholder="e.g. amit@example.com" />

    <label>Upload CSV File</label>
    <div class="file-drop" onclick="document.getElementById('fileInput').click()">
        <p>📁 Drag & drop or <span>browse file</span></p>
        <p id="file-name">No file selected</p>
        <input type="file" id="fileInput" accept=".csv" style="display:none"
               onchange="document.getElementById('file-name').textContent = this.files[0]?.name || 'No file selected'">
    </div>

    <button id="uploadBtn" onclick="uploadFile()">Upload File</button>

    <div id="status"></div>
</div>

<script>
    // ⚠️ Yeh URL baad mein API Gateway se milega — Step 5 mein update karenge
    const API_URL = 'https://8l3vrbumtj.execute-api.us-east-1.amazonaws.com/get-upload-url';

    async function uploadFile() {
        const name  = document.getElementById('userName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const file  = document.getElementById('fileInput').files[0];
        const btn   = document.getElementById('uploadBtn');
        const status = document.getElementById('status');

        // Validation
        if (!name || !email || !file) {
            showStatus('❌ Please fill all fields and select a CSV file.', 'error');
            return;
        }

        if (!file.name.endsWith('.csv')) {
            showStatus('❌ Only CSV files are allowed!', 'error');
            return;
        }

        try {
            btn.disabled = true;
            showStatus('⏳ Getting secure upload URL...', 'loading');

            // Step 1: Lambda 1 se presigned URL lo
            const res = await fetch(API_URL, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });

            const data = await res.json();

            if (!data.upload_url) throw new Error('Could not get upload URL');

            showStatus('⏳ Uploading file to S3...', 'loading');

            // Step 2: Directly S3 pe upload karo
            const uploadRes = await fetch(data.upload_url, {
                method: 'PUT',
                headers: { 'Content-Type': 'text/csv' },
                body: file
            });

            if (!uploadRes.ok) throw new Error('Upload failed');

            showStatus(`✅ File uploaded successfully! Check your email at ${email} for confirmation.`, 'success');

        } catch (err) {
            showStatus(`❌ Error: ${err.message}`, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = type;
        el.style.display = 'block';
    }
</script>
</body>
</html><!-- deployed via CI/CD -->
